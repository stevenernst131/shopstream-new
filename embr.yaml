platform: nodejs
platformVersion: "20"
autoDeploy: true

run:
  port: 3000
  startCommand: node server/index.js

database:
  seed: "psql $DATABASE_URL -f db/seed.sql"

dependencies:
  db:
    type: postgres
    required: true
    description: Primary application database
    provides:
      - name: DATABASE_URL
        secret: true
        scope: all
  stripe:
    type: external
    required: true
    description: Stripe payment processing
    provides:
      - name: STRIPE_API_KEY
        secret: true
        scope: all
      - name: STRIPE_WEBHOOK_SECRET
        secret: true
        scope: all
  openai:
    type: external
    required: false
    description: OpenAI API for product recommendations
    provides:
      - name: OPENAI_API_KEY
        secret: true
        scope: all

static:
  spaFallback: true
  headers:
    "*.js": "public, max-age=31536000, immutable"
    "*.css": "public, max-age=31536000, immutable"

healthCheck:
  path: /health
